# ===========================================
# Forte Quest Production Stack (Direct Traefik)
# ===========================================
# Python HTTP Server connects directly to Traefik on platform-net.
# Handles live filial stats, multiplayer lobby & visual novel training quest.
#
# Prerequisites (already created on host):
#   docker network create platform-net
#
# Start:
#   docker compose up -d --build
#
# ===========================================

name: forte-frontend

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forte-frontend-app
    restart: unless-stopped
    environment:
      - PORT=80
      - ADMIN_PASSWORD=forte2026
    volumes:
      - ./data:/app/data
    networks:
      - platform-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forte-frontend.rule=Host(`forte.piupiu.kz`)"
      - "traefik.http.routers.forte-frontend.service=forte-frontend"
      - "traefik.http.services.forte-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=platform-net"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/api/session >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

# ===========================================
# Traefik External Network
# ===========================================
networks:
  platform-net:
    external: true
